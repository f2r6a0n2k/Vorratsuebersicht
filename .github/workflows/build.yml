name: Build & Deploy F-Droid Repo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate APK signing keystore (dev)
        run: |
          keytool -genkey -v -keystore vorratsuebersicht.keystore -alias vorratsuebersicht \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass vorratsync -keypass vorratsync \
            -dname "CN=CI, OU=Build, O=Vorratsuebersicht, L=Unknown, ST=Unknown, C=DE"

      - name: Build APK in Xamarin Docker container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e ANDROID_SDK_ROOT=/usr/lib/android-sdk \
            -e ANDROID_HOME=/usr/lib/android-sdk \
            rheuvel89/xamarin-android:34-latest \
            bash -c '
              set -e
              echo "=== Find sdkmanager ==="
              SDKMAN=$(find /usr/lib/android-sdk /opt/android-sdk /android/sdk \
                -name sdkmanager -type f 2>/dev/null | head -1)
              if [ -z "$SDKMAN" ]; then
                SDKMAN=$(find / -name sdkmanager -type f 2>/dev/null | head -1)
              fi
              echo "sdkmanager: ${SDKMAN:?NOT FOUND}"

              echo "=== Available platforms before ==="
              ls "$ANDROID_SDK_ROOT/platforms/" 2>/dev/null || echo "empty"

              echo "=== Install Android SDK platform 33 ==="
              yes | "$SDKMAN" "platforms;android-33"

              echo "=== Available platforms after ==="
              ls "$ANDROID_SDK_ROOT/platforms/"

              echo "=== NuGet Restore ==="
              msbuild de.stryi.sln /restore /p:Configuration=Release

              echo "=== Build & Sign APK ==="
              msbuild Vorratsübersicht.csproj \
                /t:SignAndroidPackage \
                /p:Configuration=Release \
                /p:AndroidKeyStore=true \
                /p:AndroidSigningKeyStore=/workspace/vorratsuebersicht.keystore \
                /p:AndroidSigningStorePass=vorratsync \
                /p:AndroidSigningKeyAlias=vorratsuebersicht \
                /p:AndroidSigningKeyPass=vorratsync \
                /p:OutputPath=/workspace/bin/

              echo "=== Build output ==="
              find /workspace -name "*.apk" -type f 2>/dev/null
              ls -la /workspace/bin/ 2>/dev/null || echo "bin/ empty"
            '

      - name: Locate and rename APK
        id: apk
        run: |
          APK=$(find . -name '*Signed.apk' | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name '*.apk' | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "No APK found - checking directories:"
            ls -la bin/Release/ 2>/dev/null || echo "bin/Release/ not found"
            ls -la 2>/dev/null
            exit 1
          fi
          echo "Found APK: $APK"
          mv "$APK" de.stryi.Vorratsuebersicht_149.apk
          echo "path=de.stryi.Vorratsuebersicht_149.apk" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: de.stryi.Vorratsuebersicht_149.apk
          generate_release_notes: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Restore cached F-Droid repo signing key
        uses: actions/cache@v4
        id: cache-repo-key
        with:
          path: fdroid/fdroid-repo.keystore
          key: fdroid-repo-keystore-v1

      - name: Install fdroidserver
        run: pip install fdroidserver

      - name: Generate F-Droid repo index
        run: |
          mkdir -p fdroid/repo
          cp de.stryi.Vorratsuebersicht_149.apk fdroid/repo/
          cd fdroid
          fdroid update --verbose --create-key

      - name: Deploy F-Droid repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fdroid/repo
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
