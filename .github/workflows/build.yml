name: Build & Deploy F-Droid Repo

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate APK signing keystore (dev)
        id: keystore
        run: |
          keytool -genkey -v -keystore vorratsuebersicht.keystore -alias vorratsuebersicht \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass vorratsync -keypass vorratsync \
            -dname "CN=CI, OU=Build, O=Vorratsuebersicht, L=Unknown, ST=Unknown, C=DE"
          echo "base64=$(base64 -w0 vorratsuebersicht.keystore)" >> $GITHUB_OUTPUT

      - name: Build signed APK (Xamarin Docker container)
        uses: rheuvel89/xamarin-container-action@v2
        with:
          SolutionPath: Vorratsübersicht.csproj
          ProjectPath: de.stryi.sln
          SigningKeyStore: ${{ secrets.KEYSTORE_BASE64 || steps.keystore.outputs.base64 }}
          SigningKeystorePassword: ${{ secrets.KEYSTORE_PASS || 'vorratsync' }}
          SigningKeyAlias: ${{ secrets.KEY_ALIAS || 'vorratsuebersicht' }}
          SigningKeyPassword: ${{ secrets.KEY_PASS || 'vorratsync' }}
          BuildConfiguration: Release

      - name: Locate and rename APK
        id: apk
        run: |
          APK=$(find build -name '*Signed.apk' | head -1)
          if [ -z "$APK" ]; then
            APK=$(find build -name '*.apk' | head -1)
          fi
          echo "Found APK: $APK"
          mv "$APK" de.stryi.Vorratsuebersicht_149.apk
          echo "path=de.stryi.Vorratsuebersicht_149.apk" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: de.stryi.Vorratsuebersicht_149.apk
          generate_release_notes: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Restore cached F-Droid repo signing key
        uses: actions/cache@v4
        id: cache-repo-key
        with:
          path: fdroid/fdroid-repo.keystore
          key: fdroid-repo-keystore-v1

      - name: Install fdroidserver
        run: pip install fdroidserver

      - name: Generate F-Droid repo index
        run: |
          mkdir -p fdroid/repo
          cp de.stryi.Vorratsuebersicht_149.apk fdroid/repo/
          cd fdroid
          fdroid update --verbose --create-key

      - name: Deploy F-Droid repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fdroid/repo
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
