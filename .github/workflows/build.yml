name: Build & Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-server:
    name: Server APK (Master-Modus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate APK signing keystore
        run: |
          keytool -genkey -v -keystore vorratsuebersicht.keystore -alias vorratsuebersicht \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass vorratsync -keypass vorratsync \
            -dname "CN=CI, OU=Build, O=Vorratsuebersicht, L=Unknown, ST=Unknown, C=DE"

      - name: Build APK in Xamarin Docker container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            rheuvel/xamarin-android:34-latest \
            bash /workspace/tools/build-apk.sh

      - name: Locate and rename APK
        id: server-apk
        run: |
          APK=$(find . -name '*Signed.apk' | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name '*.apk' | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "No APK found - checking directories:"
            ls -la bin/Release/ 2>/dev/null || echo "bin/Release/ not found"
            ls -la 2>/dev/null
            exit 1
          fi
          echo "Found APK: $APK"
          AAPT=$(find "$ANDROID_SDK_ROOT" -name aapt -type f 2>/dev/null | head -1)
          VCODE=$("$AAPT" dump badging "$APK" 2>/dev/null | grep -oP "versionCode='\K[0-9]+" || echo "150")
          echo "Version code: $VCODE"
          cp "$APK" "de.stryi.vorratsuebersicht.sync_${VCODE}.apk"
          echo "apk_name=de.stryi.vorratsuebersicht.sync_${VCODE}.apk" >> $GITHUB_OUTPUT

      - name: Upload server APK
        uses: actions/upload-artifact@v4
        with:
          name: server-apk
          path: de.stryi.vorratsuebersicht.sync_*.apk

  build-client-android:
    name: Client Android (VorratSync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build Android APK
        run: |
          dotnet publish Client/Vorratsuebersicht.Client/Vorratsuebersicht.Client.csproj \
            -f net10.0-android -c Release \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:ApplicationDisplayVersion=1.0.${{ github.run_number }}

      - name: Locate and rename APK
        run: |
          APK=$(find Client/Vorratsuebersicht.Client/bin/Release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found"
            find Client/Vorratsuebersicht.Client/bin/Release -type f 2>/dev/null
            echo "Trying broader search..."
            find . -name "*.apk" -type f 2>/dev/null
            exit 1
          fi
          cp "$APK" "VorratSync-1.0.${{ github.run_number }}-android.apk"

      - name: Upload client Android APK
        uses: actions/upload-artifact@v4
        with:
          name: client-android-apk
          path: VorratSync-*-android.apk

  build-client-ios:
    name: Client iOS (VorratSync)
    runs-on: macos-26-xlarge
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Show .NET environment
        run: dotnet --info

      - name: Install & verify MAUI iOS workload
        run: |
          dotnet workload install maui-ios
          echo "=== Installed workloads ==="
          dotnet workload list
          echo "=== SDK info ==="
          dotnet --list-sdks

      - name: Build unsigned iOS .app
        run: |
          dotnet restore Client/Vorratsuebersicht.Client/Vorratsuebersicht.Client.csproj \
            -p:TargetFramework=net10.0-ios -p:RuntimeIdentifiers=ios-arm64
          dotnet publish Client/Vorratsuebersicht.Client/Vorratsuebersicht.Client.csproj \
            -f net10.0-ios -c Release --no-restore \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:ApplicationDisplayVersion=1.0.${{ github.run_number }} \
            -p:ArchiveOnBuild=false \
            -p:CodesignKey='' \
            -p:CodesignProvision=''

      - name: Package unsigned IPA
        run: |
          APP=$(find Client/Vorratsuebersicht.Client/bin/Release -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "No .app found - build may have produced signed IPA directly"
            IPA=$(find Client/Vorratsuebersicht.Client/bin/Release -name '*.ipa' -type f | head -1)
            if [ -n "$IPA" ]; then
              cp "$IPA" "VorratSync-1.0.${{ github.run_number }}-ios.ipa"
              echo "Found signed IPA directly"
              exit 0
            fi
            echo "No build output found"
            find Client/Vorratsuebersicht.Client/bin/Release -maxdepth 3 -type f 2>/dev/null
            exit 1
          fi
          echo "Found .app: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r "VorratSync-1.0.${{ github.run_number }}-ios.unsigned.ipa" Payload/
          rm -rf Payload
          echo "Created unsigned IPA"

      - name: Upload client iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: client-ios-ipa
          path: VorratSync-*-ios*.ipa

  deploy:
    name: Release & F-Droid Repo
    needs: [build-server, build-client-android, build-client-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List artifacts
        run: |
          echo "=== Server APK ==="
          ls -la server-apk/ 2>/dev/null || echo "(none)"
          echo "=== Client Android APK ==="
          ls -la client-android-apk/ 2>/dev/null || echo "(none)"
          echo "=== Client iOS IPA ==="
          ls -la client-ios-ipa/ 2>/dev/null || echo "(none)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Restore cached F-Droid repo signing key
        uses: actions/cache@v4
        with:
          path: fdroid/fdroid-repo.keystore
          key: fdroid-repo-keystore-v1

      - name: Install fdroidserver
        run: pip install fdroidserver

      - name: Generate F-Droid repo index
        run: |
          mkdir -p fdroid/repo
          cp server-apk/*.apk fdroid/repo/ 2>/dev/null || true
          cd fdroid
          if [ -f fdroid-repo.keystore ]; then
            fdroid update --verbose
          else
            fdroid update --verbose --create-key
          fi

      - name: Prepare Pages publish dir
        run: |
          mkdir -p publish/repo
          cp -r fdroid/repo/* publish/repo/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v9.00-sync
          name: v9.00-sync
          body: |
            ## Server APK (Master-Modus)
            - `de.stryi.vorratsuebersicht.sync_*.apk` – Sync-Server für Android (Master-Modus)

            ## Client App (VorratSync)
            - `VorratSync-*-android.apk` – Sync-Client für Android (direkt installierbar)
            - `VorratSync-*-ios*.ipa` – Sync-Client für iOS (unsigned, via SideStore/AltStore installieren)
          files: |
            server-apk/*.apk
            client-android-apk/*.apk
            client-ios-ipa/*.ipa
          make_latest: true

      - name: Deploy F-Droid repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
