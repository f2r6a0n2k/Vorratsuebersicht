name: Build & Deploy F-Droid Repo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate APK signing keystore (dev)
        id: keystore
        run: |
          keytool -genkey -v -keystore vorratsuebersicht.keystore -alias vorratsuebersicht \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass vorratsync -keypass vorratsync \
            -dname "CN=CI, OU=Build, O=Vorratsuebersicht, L=Unknown, ST=Unknown, C=DE"
          echo "base64=$(base64 -w0 vorratsuebersicht.keystore)" >> $GITHUB_OUTPUT

      - name: Build signed APK (Xamarin Docker)
        run: |
          mkdir -p build

          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e ANDROID_SDK_ROOT=/usr/lib/android-sdk \
            rheuvel/xamarin-android:34-latest \
            bash -c "
              set -e
              echo '=== Install Android SDK 33 (for XA v13.0) ==='
              yes | sdkmanager 'platforms;android-33' 2>&1 || true
              echo '=== NuGet Restore ==='
              msbuild de.stryi.sln /restore \
                /p:Configuration=Release \
                /p:AndroidSdkDirectory=/usr/lib/android-sdk
              echo '=== Build & Sign APK ==='
              msbuild Vorratsübersicht.csproj \
                /t:SignAndroidPackage \
                /p:Configuration=Release \
                /p:AndroidSdkDirectory=/usr/lib/android-sdk \
                /p:AndroidKeyStore=true \
                /p:AndroidSigningKeyStore=/workspace/vorratsuebersicht.keystore \
                /p:AndroidSigningStorePass=vorratsync \
                /p:AndroidSigningKeyAlias=vorratsuebersicht \
                /p:AndroidSigningKeyPass=vorratsync \
                /p:OutputPath=/workspace/build/
              echo '=== Build complete ==='
            "

      - name: Check build output
        run: ls -la build/

      - name: Locate and rename APK
        id: apk
        run: |
          APK=$(find build -name '*Signed.apk' | head -1)
          if [ -z "$APK" ]; then
            APK=$(find build -name '*.apk' | head -1)
          fi
          echo "Found APK: $APK"
          mv "$APK" de.stryi.Vorratsuebersicht_149.apk
          echo "path=de.stryi.Vorratsuebersicht_149.apk" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: de.stryi.Vorratsuebersicht_149.apk
          generate_release_notes: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Restore cached F-Droid repo signing key
        uses: actions/cache@v4
        id: cache-repo-key
        with:
          path: fdroid/fdroid-repo.keystore
          key: fdroid-repo-keystore-v1

      - name: Install fdroidserver
        run: pip install fdroidserver

      - name: Generate F-Droid repo index
        run: |
          mkdir -p fdroid/repo
          cp de.stryi.Vorratsuebersicht_149.apk fdroid/repo/
          cd fdroid
          fdroid update --verbose --create-key

      - name: Deploy F-Droid repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fdroid/repo
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
