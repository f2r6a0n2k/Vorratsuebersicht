name: Build & Deploy F-Droid Repo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Mono & Xamarin.Android
        run: |
          brew install mono
          brew install --cask xamarin-android
          MONO_PREFIX=$(brew --prefix mono 2>/dev/null || echo "/opt/homebrew")
          echo "$MONO_PREFIX/bin" >> $GITHUB_PATH
          for d in /Library/Frameworks/Mono.framework/Versions/Current/Commands \
                    "$MONO_PREFIX/opt/mono/bin" \
                    "/usr/local/bin"; do
            [ -d "$d" ] && echo "$d" >> $GITHUB_PATH
          done

      - name: Locate msbuild
        run: |
          echo "=== which msbuild ==="
          which msbuild 2>&1 || echo "not found"
          echo "=== find msbuild ==="
          find / -name msbuild -type f 2>/dev/null | head -10
          echo "=== find msbuild.* ==="
          find / -name 'msbuild*' -type f 2>/dev/null | head -10
          echo "=== Mono commands ==="
          ls /Library/Frameworks/Mono.framework/Versions/Current/Commands/ 2>/dev/null | head -20 || echo "dir not found"
          echo "=== Xamarin.Android ==="
          ls /Library/Frameworks/Xamarin.Android.framework/ 2>/dev/null | head -10 || echo "dir not found"
          echo "=== brew ls mono ==="
          brew ls mono 2>/dev/null | grep -i msbuild | head -10 || echo "no msbuild in mono"
          echo "=== /etc/paths.d ==="
          cat /etc/paths.d/* 2>/dev/null || echo "empty"

      - name: Generate APK signing keystore (dev)
        run: |
          keytool -genkey -v -keystore vorratsuebersicht.keystore -alias vorratsuebersicht \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass vorratsync -keypass vorratsync \
            -dname "CN=CI, OU=Build, O=Vorratsuebersicht, L=Unknown, ST=Unknown, C=DE"

      - name: Restore NuGet packages
        run: msbuild de.stryi.sln /restore /p:Configuration=Release

      - name: Build & sign APK
        run: |
          msbuild Vorratsübersicht.csproj \
            /t:SignAndroidPackage \
            /p:Configuration=Release \
            /p:AndroidKeyStore=true \
            /p:AndroidSigningKeyStore=$(pwd)/vorratsuebersicht.keystore \
            /p:AndroidSigningStorePass=vorratsync \
            /p:AndroidSigningKeyAlias=vorratsuebersicht \
            /p:AndroidSigningKeyPass=vorratsync

      - name: Locate and rename APK
        id: apk
        run: |
          APK=$(find . -path ./bin -prune -o -path ./obj -prune -o -name '*Signed.apk' -print | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -path ./bin -prune -o -path ./obj -prune -o -name '*.apk' -print | head -1)
          fi
          echo "Found APK: $APK"
          mv "$APK" de.stryi.Vorratsuebersicht_149.apk
          echo "path=de.stryi.Vorratsuebersicht_149.apk" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: de.stryi.Vorratsuebersicht_149.apk
          generate_release_notes: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Restore cached F-Droid repo signing key
        uses: actions/cache@v4
        id: cache-repo-key
        with:
          path: fdroid/fdroid-repo.keystore
          key: fdroid-repo-keystore-v1

      - name: Install fdroidserver
        run: pip install fdroidserver

      - name: Generate F-Droid repo index
        run: |
          mkdir -p fdroid/repo
          cp de.stryi.Vorratsuebersicht_149.apk fdroid/repo/
          cd fdroid
          fdroid update --verbose --create-key

      - name: Deploy F-Droid repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fdroid/repo
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
