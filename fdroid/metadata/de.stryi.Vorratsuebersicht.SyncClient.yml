AutoName: VorratSync
Summary: LAN sync client for Vorratsübersicht
Description: |-
    VorratSync is the companion app for Vorratsübersicht's distributed
    database synchronization feature.

    Connect to a Vorratsübersicht Master (sync server) on your local
    network to view and edit your pantry inventory, storage items,
    and shopping list from any Android device.

    Features:
    * Automatic master discovery via UDP broadcast
    * Real-time sync with master server
    * Offline-first: changes stored locally, synced when connected
    * PIN-based access control
    * Clean modern UI built with .NET MAUI

